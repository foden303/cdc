syntax = "proto3";

package cdc.v1;

option go_package = "github.com/foden/cdc/api/proto/v1;cdcpb";

import "google/api/annotations.proto";
import "health.proto";
import "source.proto";
import "sink.proto";
import "explorer.proto";
import "metrics.proto";
import "dlq.proto";
import "flow.proto";

//  CDC Service — Kafka-UI–style APIs for the CDC queue system.
service CDCService {

  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse) {
    option (google.api.http) = {
      get : "/api/v1/health"
    };
  }

  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse) {
    option (google.api.http) = {
      get : "/api/v1/config"
    };
  }

  //  Dynamic Sources
  rpc AddSource(AddSourceRequest) returns (AddSourceResponse) {
    option (google.api.http) = {
      post : "/api/v1/sources"
      body : "*"
    };
  }

  rpc RemoveSource(RemoveSourceRequest) returns (RemoveSourceResponse) {
    option (google.api.http) = {
      delete : "/api/v1/sources/{instance_id}"
    };
  }

  //  Dynamic Sinks
  rpc AddSink(AddSinkRequest) returns (AddSinkResponse) {
    option (google.api.http) = {
      post : "/api/v1/sinks"
      body : "*"
    };
  }

  rpc RemoveSink(RemoveSinkRequest) returns (RemoveSinkResponse) {
    option (google.api.http) = {
      delete : "/api/v1/sinks/{instance_id}"
    };
  }

  rpc UpdateSource(UpdateSourceRequest) returns (UpdateSourceResponse) {
    option (google.api.http) = {
      put : "/api/v1/sources/{source.instance_id}"
      body : "*"
    };
  }

  rpc UpdateSink(UpdateSinkRequest) returns (UpdateSinkResponse) {
    option (google.api.http) = {
      put : "/api/v1/sinks/{sink.instance_id}"
      body : "*"
    };
  }

  rpc GetStats(GetStatsRequest) returns (GetStatsResponse) {
    option (google.api.http) = {
      get : "/api/v1/stats"
    };
  }

  //  Explorer API
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse) {
    option (google.api.http) = {
      get : "/api/v1/messages"
    };
  }

  rpc GetConsumerInfo(GetConsumerInfoRequest)
      returns (GetConsumerInfoResponse) {
    option (google.api.http) = {
      get : "/api/v1/consumer"
    };
  }

  rpc ListTopics(ListTopicsRequest) returns (ListTopicsResponse) {
    option (google.api.http) = {
      get : "/api/v1/topics"
    };
  }

  rpc ListPartitions(ListPartitionsRequest) returns (ListPartitionsResponse) {
    option (google.api.http) = {
      get : "/api/v1/partitions"
    };
  }

  rpc ReprocessDLQ(ReprocessDLQRequest) returns (ReprocessDLQResponse) {
    option (google.api.http) = {
      post : "/api/v1/dlq/reprocess"
    };
  }

  rpc GetPerformanceMetrics(GetPerformanceMetricsRequest) returns (GetPerformanceMetricsResponse) {
    option (google.api.http) = {
      get : "/api/v1/metrics/performance"
    };
  }

  // Flow CRUD
  rpc CreateFlow(CreateFlowRequest) returns (CreateFlowResponse) {
    option (google.api.http) = {
      post : "/api/v1/flows"
      body : "*"
    };
  }

  rpc ListFlows(ListFlowsRequest) returns (ListFlowsResponse) {
    option (google.api.http) = {
      get : "/api/v1/flows"
    };
  }

  rpc GetFlow(GetFlowRequest) returns (GetFlowResponse) {
    option (google.api.http) = {
      get : "/api/v1/flows/{flow_id}"
    };
  }

  rpc UpdateFlow(UpdateFlowRequest) returns (UpdateFlowResponse) {
    option (google.api.http) = {
      put : "/api/v1/flows/{flow_id}"
      body : "*"
    };
  }

  rpc DeleteFlow(DeleteFlowRequest) returns (DeleteFlowResponse) {
    option (google.api.http) = {
      delete : "/api/v1/flows/{flow_id}"
    };
  }

  // Connection Test
  rpc TestSourceConnection(TestSourceConnectionRequest) returns (TestSourceConnectionResponse) {
    option (google.api.http) = {
      post : "/api/v1/test/source"
      body : "*"
    };
  }

  rpc TestSinkConnection(TestSinkConnectionRequest) returns (TestSinkConnectionResponse) {
    option (google.api.http) = {
      post : "/api/v1/test/sink"
      body : "*"
    };
  }

  // Table Discovery
  rpc DiscoverTables(DiscoverTablesRequest) returns (DiscoverTablesResponse) {
    option (google.api.http) = {
      get : "/api/v1/discover/tables/{source_id}"
    };
  }

  rpc DiscoverSinkTables(DiscoverSinkTablesRequest) returns (DiscoverSinkTablesResponse) {
    option (google.api.http) = {
      get : "/api/v1/discover/sink-tables/{sink_id}"
    };
  }

  // Flow Pause/Resume
  rpc PauseFlow(PauseFlowRequest) returns (PauseFlowResponse) {
    option (google.api.http) = {
      post : "/api/v1/flows/{flow_id}/pause"
    };
  }

  rpc ResumeFlow(ResumeFlowRequest) returns (ResumeFlowResponse) {
    option (google.api.http) = {
      post : "/api/v1/flows/{flow_id}/resume"
    };
  }

  // Flow Stats
  rpc GetFlowStats(GetFlowStatsRequest) returns (GetFlowStatsResponse) {
    option (google.api.http) = {
      get : "/api/v1/flows/{flow_id}/stats"
    };
  }

  rpc GetFlowTableProgress(GetFlowTableProgressRequest) returns (GetFlowTableProgressResponse) {
    option (google.api.http) = {
      get : "/api/v1/flows/{flow_id}/progress"
    };
  }

}

// Config-related messages

// Request to get application configuration (empty).
message GetConfigRequest {}

// Response containing application configuration and available connectors.
message GetConfigResponse {
  AppConfig config = 1;
  repeated string available_sources = 2;
  repeated string available_sinks = 3;
}

// Full application configuration.
message AppConfig {
  string name = 1;
  string log_mode = 2;
  repeated SourceConfig sources = 3;
  repeated SinkConfig sinks = 4;
  PipelineConfig pipeline = 5;
  NATSConfig nats = 6;
}

// Pipeline processing configuration.
message PipelineConfig {
  int32 channel_buffer_size = 1;
  int32 worker_count = 2;
  int32 batch_size = 3;
  int32 flush_interval_ms = 4;
  repeated string subject_filter = 5;
}

// NATS connection and streaming configuration.
message NATSConfig {
  bool enabled = 1;
  string url = 2;
  string stream_name = 3;
  int32 retention_days = 4;
  int32 max_reconnects = 5;
  int32 reconnect_wait_ms = 6;
  int32 reconnect_buffer_size_mb = 7;
  int32 max_ack_pending = 8;
  int32 ack_wait_ms = 9;
  int32 max_deliver = 10;
}
