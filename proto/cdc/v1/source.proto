syntax = "proto3";

package cdc.v1;

option go_package = "github.com/foden/cdc/api/proto/v1;cdcpb";

// Configuration for a CDC source connector.
message SourceConfig {
  string type = 1;
  string host = 2;
  int32 port = 3;
  optional string username = 4;
  optional string password = 5;
  string database = 6;
  repeated string tables = 7;
  optional string slot_name = 8;
  optional string publication_name = 9;
  string instance_id = 10; // Unique ID for source
  optional string name = 11; // Display name
  optional string topic = 12; // Routing topic
  optional string url = 13;
  map<string, string> headers = 14;
  optional int32 polling_interval_ms = 15;
  optional string snapshot_mode = 16;
}

// Request to add a new source.
message AddSourceRequest {
  SourceConfig source = 1;
}

// Response after adding a source.
message AddSourceResponse {
  string instance_id = 1;
}

// Request to remove an existing source.
message RemoveSourceRequest {
  string instance_id = 1;
}

// Response after removing a source.
message RemoveSourceResponse {
  bool success = 1;
}

// Request to update an existing source.
message UpdateSourceRequest {
  SourceConfig source = 1;
}

// Response after updating a source.
message UpdateSourceResponse {
  bool success = 1;
}
