syntax = "proto3";

package cdc.v1;

option go_package = "github.com/foden/cdc/api/proto/v1;cdcpb";

// Get stats request (empty).
message GetStatsRequest {}

// Get stats response with source and sink statistics.
message GetStatsResponse {
  map<string, ComponentStats> source_stats = 1;
  map<string, ComponentStats> sink_stats = 2;
}

// Statistics for a single component (source or sink).
message ComponentStats {
  uint64 success_count = 1;
  uint64 failure_count = 2;
  string last_error = 3;
  map<int32, uint64> partition_lag = 4;
}

// Get performance metrics request (empty).
message GetPerformanceMetricsRequest {}

// Get performance metrics response with throughput, latency, and per-component metrics.
message GetPerformanceMetricsResponse {
  double throughput = 1;      // Events per second
  double latency_p99 = 2;     // Milliseconds
  uint32 active_workers = 3;
  double error_rate = 4;      // Percentage
  map<string, SinkPerformance> sinks = 5;
  map<string, SourcePerformance> sources = 6;
}

// Performance metrics for a single source.
message SourcePerformance {
  string source_id = 1;
  double throughput = 2;
  double error_rate = 3;
}

// Performance metrics for a single sink.
message SinkPerformance {
  string sink_id = 1;
  double throughput = 2;
  double avg_latency = 3;
}
