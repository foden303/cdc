name: Bump Version

on:
  pull_request:
    types: [closed]
    branches:
      - main

concurrency:
  group: version-bump-main
  cancel-in-progress: false

jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Check for self-trigger
        id: self_trigger
        run: |
          HEAD_MSG=$(git log -1 --format='%s')
          if [[ "$HEAD_MSG" == chore\(release\):\ v* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: head commit is a version bump commit"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read and validate version
        id: bump
        if: steps.self_trigger.outputs.skip != 'true'
        run: |
          VERSION_FILE="version/version.go"

          # Check if file exists
          if [ ! -f "$VERSION_FILE" ]; then
            echo "::error::Version file not found: $VERSION_FILE"
            exit 1
          fi

          # Extract version string using grep and sed
          CURRENT_VERSION=$(grep 'const Version' "$VERSION_FILE" | sed 's/.*"\(.*\)".*/\1/')

          if [ -z "$CURRENT_VERSION" ]; then
            echo "::error::Could not extract version from $VERSION_FILE. Expected format: const Version = \"X.Y.Z\""
            exit 1
          fi

          # Validate version matches ^[0-9]\.[0-9]\.[0-9]$
          if ! echo "$CURRENT_VERSION" | grep -qE '^[0-9]\.[0-9]\.[0-9]$'; then
            echo "::error::Invalid version format: '$CURRENT_VERSION'. Expected format: X.Y.Z where each segment is a single digit 0-9"
            exit 1
          fi

          # Parse into MAJOR, MINOR, PATCH
          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)

          # Check for max version
          if [ "$MAJOR" -eq 9 ] && [ "$MINOR" -eq 9 ] && [ "$PATCH" -eq 9 ]; then
            echo "::error::Maximum version reached: 9.9.9. Cannot bump further."
            exit 1
          fi

          # Apply odometer bump logic
          if [ "$PATCH" -lt 9 ]; then
            PATCH=$((PATCH + 1))
          elif [ "$MINOR" -lt 9 ]; then
            PATCH=0
            MINOR=$((MINOR + 1))
          else
            PATCH=0
            MINOR=0
            MAJOR=$((MAJOR + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Bumped version: $CURRENT_VERSION -> $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Write version and commit
        if: steps.self_trigger.outputs.skip != 'true' && steps.bump.outputs.new_version != ''
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          VERSION_FILE="version/version.go"

          # Write the version file with exact structure
          printf 'package version\n\nconst Version = "%s"\n' "$NEW_VERSION" > "$VERSION_FILE"

          # Configure git with bot identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there are changes
          if git diff --quiet "$VERSION_FILE"; then
            echo "No changes detected in $VERSION_FILE. Skipping commit and push."
            exit 0
          fi

          # Commit and push
          git add "$VERSION_FILE"
          git commit -m "chore(release): v${NEW_VERSION}"
          git push
