syntax = "proto3";

package cdc.v1;

option go_package = "github.com/foden/cdc/api/proto/v1;cdcpb";

import "google/api/annotations.proto";

//  CDC Service — Kafka-UI–style APIs for the CDC queue system.
service CDCService {

  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse) {
    option (google.api.http) = {
      get : "/api/v1/health"
    };
  }

  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse) {
    option (google.api.http) = {
      get : "/api/v1/config"
    };
  }

  //  Dynamic Sources
  rpc AddSource(AddSourceRequest) returns (AddSourceResponse) {
    option (google.api.http) = {
      post : "/api/v1/sources"
      body : "*"
    };
  }

  rpc RemoveSource(RemoveSourceRequest) returns (RemoveSourceResponse) {
    option (google.api.http) = {
      delete : "/api/v1/sources/{instance_id}"
    };
  }

  //  Dynamic Sinks
  rpc AddSink(AddSinkRequest) returns (AddSinkResponse) {
    option (google.api.http) = {
      post : "/api/v1/sinks"
      body : "*"
    };
  }

  rpc RemoveSink(RemoveSinkRequest) returns (RemoveSinkResponse) {
    option (google.api.http) = {
      delete : "/api/v1/sinks/{instance_id}"
    };
  }

  rpc UpdateSource(UpdateSourceRequest) returns (UpdateSourceResponse) {
    option (google.api.http) = {
      put : "/api/v1/sources/{source.instance_id}"
      body : "*"
    };
  }

  rpc UpdateSink(UpdateSinkRequest) returns (UpdateSinkResponse) {
    option (google.api.http) = {
      put : "/api/v1/sinks/{sink.instance_id}"
      body : "*"
    };
  }

  rpc GetStats(GetStatsRequest) returns (GetStatsResponse) {
    option (google.api.http) = {
      get : "/api/v1/stats"
    };
  }

  //  Explorer API
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse) {
    option (google.api.http) = {
      get : "/api/v1/messages"
    };
  }

  rpc GetConsumerInfo(GetConsumerInfoRequest)
      returns (GetConsumerInfoResponse) {
    option (google.api.http) = {
      get : "/api/v1/consumer"
    };
  }

  rpc ListTopics(ListTopicsRequest) returns (ListTopicsResponse) {
    option (google.api.http) = {
      get : "/api/v1/topics"
    };
  }

  rpc ListPartitions(ListPartitionsRequest) returns (ListPartitionsResponse) {
    option (google.api.http) = {
      get : "/api/v1/partitions"
    };
  }

  rpc ReprocessDLQ(ReprocessDLQRequest) returns (ReprocessDLQResponse) {
    option (google.api.http) = {
      post : "/api/v1/dlq/reprocess"
    };
  }

  rpc GetPerformanceMetrics(GetPerformanceMetricsRequest) returns (GetPerformanceMetricsResponse) {
    option (google.api.http) = {
      get : "/api/v1/metrics/performance"
    };
  }

}

message GetPerformanceMetricsRequest {}

message GetPerformanceMetricsResponse {
  double throughput = 1;      // Events per second
  double latency_p99 = 2;     // Milliseconds
  uint32 active_workers = 3;
  double error_rate = 4;      // Percentage
  map<string, SinkPerformance> sinks = 5;
  map<string, SourcePerformance> sources = 6;
}

message SourcePerformance {
  string source_id = 1;
  double throughput = 2;
  double error_rate = 3;
}

message SinkPerformance {
  string sink_id = 1;
  double throughput = 2;
  double avg_latency = 3;
}

// ... messages ...
message GetConfigRequest {}

message GetConfigResponse {
  AppConfig config = 1;
  repeated string available_sources = 2;
  repeated string available_sinks = 3;
}

message AppConfig {
  string name = 1;
  string log_mode = 2;
  repeated SourceConfig sources = 3;
  repeated SinkConfig sinks = 4;
  PipelineConfig pipeline = 5;
  NATSConfig nats = 6;
}

message PipelineConfig {
  int32 channel_buffer_size = 1;
  int32 worker_count = 2;
  int32 batch_size = 3;
  int32 flush_interval_ms = 4;
  repeated string subject_filter = 5;
}

message NATSConfig {
  bool enabled = 1;
  string url = 2;
  string stream_name = 3;
  int32 retention_days = 4;
  int32 max_reconnects = 5;
  int32 reconnect_wait_ms = 6;
  int32 reconnect_buffer_size_mb = 7;
  int32 max_ack_pending = 8;
  int32 ack_wait_ms = 9;
  int32 max_deliver = 10;
}

message SourceConfig {
  string type = 1;
  string host = 2;
  int32 port = 3;
  optional string username = 4;
  optional string password = 5;
  string database = 6;
  repeated string tables = 7;
  optional string slot_name = 8;
  optional string publication_name = 9;
  string instance_id = 10; // Unique ID for source
  optional string name = 11;  // Display name
  optional string topic = 12; // Routing topic
  optional string url = 13;
  map<string, string> headers = 14;
  optional int32 polling_interval_ms = 15;
  optional string snapshot_mode = 16;
}

message SinkConfig {
  string type = 1;
  repeated string url = 2;
  optional string username = 3;
  optional string password = 4;
  optional string index_prefix = 5;
  optional string index = 6;
  map<string, string> index_mapping = 7;
  optional int32 batch_size = 8;
  optional int32 flush_interval_ms = 9;
  optional int32 max_retries = 10;
  optional int32 retry_base_ms = 11;
  optional string api_key = 12;
  string instance_id = 13; // Unique ID for sink
  optional string name = 14;        // Display name
  optional string topic = 15;       // Routing topic
  map<string, string> field_mapping = 16;
  RedisSettings redis = 17;
}

message RedisSettings {
  string command = 1;      // set, hset, sadd, bf_add
  string key_template = 2; // CEL template
  repeated string value_fields = 3;
  int32 ttl = 4;           // seconds
}

//  Dynamic Operations
message AddSourceRequest { SourceConfig source = 1; }
message AddSourceResponse { string instance_id = 1; }

message RemoveSourceRequest { string instance_id = 1; }
message RemoveSourceResponse { bool success = 1; }

message AddSinkRequest { SinkConfig sink = 1; }
message AddSinkResponse { string instance_id = 1; }

message RemoveSinkRequest { string instance_id = 1; }
message RemoveSinkResponse { bool success = 1; }

message UpdateSourceRequest { SourceConfig source = 1; }
message UpdateSourceResponse { bool success = 1; }

message UpdateSinkRequest { SinkConfig sink = 1; }
message UpdateSinkResponse { bool success = 1; }


message HealthCheckRequest {}

message HealthCheckResponse {
  string status = 1;
  string version = 2;
  int64 uptime = 3; // seconds since start
}

message GetStatsRequest {}

message GetStatsResponse {
  map<string, ComponentStats> source_stats = 1;
  map<string, ComponentStats> sink_stats = 2;
}

message ComponentStats {
  uint64 success_count = 1;
  uint64 failure_count = 2;
  string last_error = 3;
  map<int32, uint64> partition_lag = 4;
}

// Advanced Explorer
message ListMessagesRequest {
  MessageStatus status = 1;
  optional string source_id = 2;
  optional string topic = 3;
  optional string partition = 4;
  OffsetPaginationRequest pagination = 5;
}

enum MessageStatus {
  MESSAGE_STATUS_UNSPECIFIED = 0;
  MESSAGE_STATUS_SENT = 1;
  MESSAGE_STATUS_UNSENT = 2;
}

message ListMessagesResponse {
  repeated MessageItem data = 1;
  uint64 total_count = 2;
  OffsetPaginationResponse pagination = 3;
}

message MessageItem {
  uint64 sequence = 1;
  string timestamp = 2;
  string subject = 3;
  bytes data = 4;
  map<string, string> headers = 5;
}

message GetConsumerInfoRequest { string consumer_name = 1; }

message GetConsumerInfoResponse {
  uint64 ack_floor = 1; // Highest sequence fully acknowledged
  uint64 pending_count = 2;
}

message ListTopicsRequest { OffsetPaginationRequest pagination = 1; }

message ListTopicsResponse {
  repeated TopicSummary data = 1;
  OffsetPaginationResponse pagination = 2;
}

message TopicSummary {
  string name = 1;
  uint64 message_count = 2;
  int32 partition_count = 3;
}

message ListPartitionsRequest {
  string topic = 1;
  OffsetPaginationRequest pagination = 2;
}

message ListPartitionsResponse {
  repeated PartitionSummary data = 1;
  OffsetPaginationResponse pagination = 2;
}

message PartitionSummary {
  string id = 1; // Full subject/partition name
  uint64 message_count = 2;
  string topic = 3;
}

message OffsetPaginationRequest {
  uint32 limit = 1;
  uint32 page = 2;
  repeated Sort sort = 3;
}

message Sort {
  string field = 1;
  SortOrder order = 2;
}

enum SortOrder {
  SORT_ORDER_UNSPECIFIED = 0;
  SORT_ORDER_ASC = 1;
  SORT_ORDER_DESC = 2;
}

message OffsetPaginationResponse {
  uint64 total_rows = 1;
  uint32 limit = 2;
  uint32 page = 3;
  bool has_next = 4;
  bool has_prev = 5;
  repeated Sort sort = 6;
}

message ReprocessDLQRequest {}

message ReprocessDLQResponse {
  int32 count = 1;
}

